# Runs the test suite inside KiCad's official Docker images, so every push is checked on KiCad 10 (and 9)
# without anyone having KiCad installed. Results show on the commit in GitHub.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kicad: ["10.0", "9.0"]
    container:
      image: kicad/kicad:${{ matrix.kicad }}
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          apt-get update -qq
          apt-get install -y -qq python3-pip openjdk-21-jre-headless ffmpeg >/dev/null || \
            apt-get install -y -qq python3-pip default-jre-headless ffmpeg >/dev/null
          python3 -m pip install --break-system-packages -q -r requirements.txt pytest
      - name: Versions
        run: |
          kicad-cli version
          python3 -c "import pcbnew; print('pcbnew', pcbnew.GetBuildVersion())"
          java -version 2>&1 | head -1
          python3 -m kipipe.cli doctor || true
      - name: Freerouting
        run: python3 -m kipipe.cli fetch-router
      - name: Tests
        run: python3 -m pytest tests -q -ra
